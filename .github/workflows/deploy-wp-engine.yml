name: Reusable WP Engine Deployment

on:
  workflow_call:
    inputs:
      widget_name:
        description: 'Widget name to deploy'
        required: true
        type: string
      environment_type:
        description: 'Environment type (staging or production)'
        required: true
        type: string
      tag_name:
        description: 'Tag name to deploy (for production)'
        required: false
        type: string
      dry_run:
        description: 'Run deployment in dry run mode (production only)'
        required: false
        type: boolean
        default: false
      delete:
        description: 'Include --delete flag in deployment (production only)'
        required: false
        type: boolean
        default: true
      cache_clear:
        description: 'Clear WP Engine cache after deploy'
        required: false
        type: boolean
        default: false
      max_parallel:
        description: 'Maximum number of WP Engine environments to deploy in parallel'
        required: false
        type: number
        default: 5
      throttle_delay_seconds:
        description: 'Fixed delay before each deploy attempt to reduce burst traffic'
        required: false
        type: number
        default: 1
      cleanup_after_deploy:
        description: 'Run post-deploy cleanup commands on remote server (delete mode only)'
        required: false
        type: boolean
        default: false
    secrets:
      WPE_ORG_API_USER:
        description: 'WP Engine API username'
        required: true
      WPE_ORG_API_PASS:
        description: 'WP Engine API password'
        required: true
      WPE_ORG_SSHG_KEY_PRIVATE:
        description: 'WP Engine SSH private key'
        required: true

jobs:
  fetch-installs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.extract.outputs.envs }}
    steps:
      - name: Fetch all installs from WP Engine API (with pagination)
        id: fetch
        run: |
          # WP Engine API may return 40 per page by default. Paginate until we get 0 results.
          # Do not stop when count < limit or we miss sites (e.g. only 40 of 52 production).
          offset=0
          limit=100
          echo "[]" > all_installs.json
          while true; do
            echo "Fetching installs offset=$offset..."
            curl -s -u "${{ secrets.WPE_ORG_API_USER }}:${{ secrets.WPE_ORG_API_PASS }}" \
              "https://api.wpengineapi.com/v1/installs?limit=$limit&offset=$offset" \
              -o page.json
            count=$(jq '.results // [] | length' page.json)
            if [ "$count" -eq 0 ]; then
              echo "No more results at offset=$offset, stopping."
              break
            fi
            echo "Got $count installs (offset=$offset)"
            jq -s '.[0] + (.[1].results // [])' all_installs.json page.json > merged.json
            mv merged.json all_installs.json
            offset=$((offset + limit))
          done
          total=$(jq 'length' all_installs.json)
          echo "Fetched $total total installs from WP Engine API"
      - name: Extract environment names
        id: extract
        run: |
          if [ "${{ inputs.environment_type }}" = "production" ]; then
            envs=$(jq -r '[.[] | select(.environment == "production") | .name] | @json' all_installs.json)
          else
            envs=$(jq -r '[.[] | select(.environment == "staging") | .name] | @json' all_installs.json)
          fi
          echo "envs=$envs" >> $GITHUB_OUTPUT

  lint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo for linting
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || 'main' }}

      - name: Lint PHP files once
        run: |
          set -e
          PHP_FILES="$(git ls-files '*.php')"
          if [ -z "$PHP_FILES" ]; then
            echo "No PHP files found to lint."
            exit 0
          fi

          echo "Linting PHP files once before matrix deployment..."
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            php -l "$file" >/dev/null
          done <<< "$PHP_FILES"
          echo "✅ PHP lint passed."

  deploy:
    needs:
      - fetch-installs
      - lint-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.fetch-installs.outputs.envs) }}
      max-parallel: ${{ inputs.max_parallel }}
    steps:
      - name: Delay to avoid rate limiting
        if: ${{ inputs.throttle_delay_seconds > 0 }}
        run: |
          echo "Waiting ${{ inputs.throttle_delay_seconds }} seconds to avoid WP Engine rate limits..."
          sleep "${{ inputs.throttle_delay_seconds }}"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || 'main' }}



      - name: Validate SSH and ensure plugin directory exists
        run: |
          echo "${{ secrets.WPE_ORG_SSHG_KEY_PRIVATE }}" > $HOME/wpe_key
          chmod 600 $HOME/wpe_key
          REMOTE_PATH="sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}"
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i $HOME/wpe_key wpe_gha+${{ matrix.env }}@${{ matrix.env }}.ssh.wpengine.net \
            "echo 'SSH access confirmed'; mkdir -p \"$REMOTE_PATH\"" 2>/dev/null; then
            echo "✅ SSH access confirmed and widget directory ensured for ${{ matrix.env }}"
          else
            echo "❌ SSH access failed or could not create widget directory for ${{ matrix.env }}"
            exit 1
          fi

      - name: Deploy to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_ENV: ${{ matrix.env }}
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_ORG_SSHG_KEY_PRIVATE }}
          SRC_PATH: ./
          REMOTE_PATH: wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/
          PHP_LINT: false
          CACHE_CLEAR: ${{ inputs.cache_clear }}
          FLAGS: -azvr --chmod=D775,F664 ${{ inputs.delete && '--delete' || '--inplace' }} --exclude=".*" --exclude=".git/" --exclude=".github/" --exclude="node_modules/" --exclude="package.json" --exclude="package-lock.json" --exclude="README.md" --exclude="CHANGELOG.md" --exclude=".releaserc.json" --exclude="update-version-number.js" --exclude=".gitignore" --exclude=".rsyncignore" --exclude="*.log" --exclude=".DS_Store" --exclude="*.md" ${{ inputs.dry_run && '--dry-run' || '' }}





      - name: Clean up unwanted files (if enabled)
        if: ${{ !inputs.dry_run && inputs.delete && inputs.cleanup_after_deploy }}
        run: |
          echo "${{ secrets.WPE_ORG_SSHG_KEY_PRIVATE }}" > $HOME/wpe_key
          chmod 600 $HOME/wpe_key
          
          echo "Cleaning up unwanted files from WP Engine..."
          
          # Remove specific files and directories that should not be on the server
          ssh -o StrictHostKeyChecking=no -i $HOME/wpe_key wpe_gha+${{ matrix.env }}@${{ matrix.env }}.ssh.wpengine.net \
            "rm -rf sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/.git && \
             rm -rf sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/.github && \
             rm -rf sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/node_modules && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/package.json && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/package-lock.json && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/README.md && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/CHANGELOG.md && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/.releaserc.json && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/update-version-number.js && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/.gitignore && \
             rm -f sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }}/.rsyncignore && \
             find sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }} -name '*.log' -delete && \
             find sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }} -name '.DS_Store' -delete && \
             find sites/${{ matrix.env }}/wp-content/plugins/uu-so-widgets/uu-so-widgets-bundle/${{ inputs.widget_name }} -name '*.md' -delete" 2>/dev/null || true
          
          echo "Cleanup completed."

      - name: Log Deployment Summary
        run: |
          echo "✅ Deployed to WP Engine ${{ inputs.environment_type }} (${{ matrix.env }})." >> $GITHUB_STEP_SUMMARY
